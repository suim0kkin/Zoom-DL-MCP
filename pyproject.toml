[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zoom-dl-mcp"
version = "1.0.0"
description = "Zero-dependency browserless Zoom Cloud Recording Downloader & Model Context Protocol (MCP) server."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Watarai Haruki" }
]
keywords = [
    "zoom",
    "downloader",
    "mcp",
    "model-context-protocol",
    "video-downloader",
    "recording"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Internet :: WWW/HTTP"
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0"
]

[project.scripts]
zoom-dl = "zoom_dl_mcp.cli:main"
zoom-dl-mcp = "zoom_dl_mcp.server:run_server"

[project.urls]
Homepage = "https://github.com/suim0kkin/Zoom-DL-MCP"
Repository = "https://github.com/suim0kkin/Zoom-DL-MCP.git"
Issues = "https://github.com/suim0kkin/Zoom-DL-MCP/issues"

[tool.setuptools.packages.find]
where = ["src"]
